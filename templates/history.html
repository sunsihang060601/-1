<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>历史归档面板 - Dashboard</title>
    <style>
        :root { --bg-main: #fafafa; --sidebar-bg: #ffffff; --card-bg: #ffffff; --border-color: #e5e7eb; --text-main: #111827; --text-muted: #6b7280; --primary: #10b981; --sidebar-width: 260px; --shadow-sm: 0 1px 3px rgba(0,0,0,0.05); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; display: flex; background-image: radial-gradient(#e5e7eb 1px, transparent 1px); background-size: 24px 24px; }
        .sidebar { width: var(--sidebar-width); background: var(--sidebar-bg); border-right: 1px solid var(--border-color); position: fixed; top: 0; bottom: 0; left: 0; display: flex; flex-direction: column; padding: 24px 16px; z-index: 100; }
        .brand-logo { display: flex; align-items: center; gap: 12px; font-size: 1.25rem; font-weight: 700; color: var(--text-main); padding: 12px; margin-bottom: 32px; border-bottom: 1px solid var(--border-color); text-decoration: none; }
        .nav-menu { display: flex; flex-direction: column; gap: 8px; flex: 1; }
        .nav-item { display: flex; align-items: center; gap: 14px; padding: 12px 16px; color: var(--text-muted); text-decoration: none; font-size: 0.95rem; font-weight: 500; border-radius: 8px; }
        .nav-item:hover { background: #f3f4f6; color: var(--text-main); }
        .nav-item.active { background: rgba(16, 185, 129, 0.1); color: var(--primary); }
        .sidebar-footer { padding: 12px; border-top: 1px solid var(--border-color); }
        .logout-btn { display: flex; align-items: center; gap: 10px; color: #ef4444; text-decoration: none; font-size: 0.95rem; padding: 10px; border-radius: 6px; }
        .main-wrapper { margin-left: var(--sidebar-width); width: calc(100% - var(--sidebar-width)); display: flex; flex-direction: column; min-height: 100vh; }
        .top-header { height: 75px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; padding: 0 40px; background: rgba(250, 250, 250, 0.8); backdrop-filter: blur(8px); }
        .dashboard-content { padding: 40px; flex: 1; }
        .history-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
        .history-card { background: #fff; border-radius: 16px; padding: 30px; border: 1px solid var(--border-color); box-shadow: var(--shadow-sm); }
        .history-list { max-height: 400px; overflow-y: auto; }
        .history-item { padding: 14px; background: #f9fafb; border-radius: 8px; margin-bottom: 10px; border-left: 4px solid var(--primary); }
        .tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.8rem; background: #ecfdf5; color: var(--primary); font-weight: 600; margin-right: 6px; }
    </style>
</head>
<body>
    <div class="sidebar">
        <a href="/index" class="brand-logo"><span>♻️</span><span>EcoConsole</span></a>
        <div class="nav-menu">
            <a href="/index" class="nav-item">📊 概览中心</a>
            <a href="/identify" class="nav-item">📷 智能识别</a>
            <a href="/chat" class="nav-item">🤖 AI助手</a>
            <a href="/history" class="nav-item active">📊 历史统计</a>
            <a href="/community" class="nav-item">🌍 环保社区</a>
            <a href="/users" class="nav-item">👥 用户管理</a>
        </div>
        <div class="sidebar-footer"><a href="/login" class="logout-btn">🚪 退出工作台</a></div>
    </div>

    <div class="main-wrapper">
        <div class="top-header"><div style="font-weight: 500; color: var(--text-muted);">工作台 / 历史统计</div></div>
        <div class="dashboard-content">
            <div class="history-grid">
                <div class="history-card">
                    <h3 style="margin-bottom:15px;">🖼️ 边缘图像检测历史</h3>
                    <div class="history-list" id="identifyHistoryList">
                        <div style="text-align:center; padding:20px; color:#aaa;">正在同步本地识别总线记录...</div>
                    </div>
                </div>
                
                <div class="history-card">
                    <h3 style="margin-bottom:15px;">🤖 AI大语言大脑会话快照</h3>
                    <div class="history-list" id="chatHistoryList">
                        <div style="text-align:center; padding:20px; color:#aaa;">正在同步AI大模型会话快照...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        function loadHistory() {
            // 1. 渲染 AI 问答交互快照
            const chatContainer = document.getElementById('chatHistoryList'); 
            const chatHist = JSON.parse(localStorage.getItem('chatHistory')) || [];
            if(chatHist.length === 0) { 
                chatContainer.innerHTML = '<div style="text-align:center; padding:20px; color:#aaa;">暂无会话记录快照</div>'; 
            } else {
                chatContainer.innerHTML = chatHist.map(item => `
                    <div class="history-item">
                        <div style="font-size:0.85rem; color:#888; margin-bottom:5px;">${item.time}</div>
                        <div style="font-size:0.95rem;"><strong>问:</strong> ${item.question}<br><span style="color:var(--primary)"><strong>答:</strong> ${item.answer.substring(0,40)}...</span></div>
                    </div>
                `).join('');
            }

            // 2. 💥 新增：渲染真实的 YOLO 识别动作历史记录
            const idenContainer = document.getElementById('identifyHistoryList');
            const idenHist = JSON.parse(localStorage.getItem('identifyHistory')) || [];
            if(idenHist.length === 0) {
                idenContainer.innerHTML = '<div style="text-align:center; padding:20px; color:#aaa;">暂无真实硬推识别日志，快去【智能识别】体验吧！</div>';
            } else {
                idenContainer.innerHTML = idenHist.map(item => `
                    <div class="history-item">
                        <div style="font-size:0.85rem; color:#888; margin-bottom:5px;">${item.time} [${item.mode}]</div>
                        <div style="font-size:0.95rem;">
                            <span class="tag">${item.category}</span>识别结果: <strong>${item.name}</strong>
                        </div>
                    </div>
                `).join('');
            }
        }
        window.onload = loadHistory;
    </script>
</body>
</html>
