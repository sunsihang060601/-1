<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户管理中心 - Dashboard</title>
    <style>
        :root { --bg-main: #fafafa; --sidebar-bg: #ffffff; --card-bg: #ffffff; --border-color: #e5e7eb; --text-main: #111827; --text-muted: #6b7280; --primary: #10b981; --sidebar-width: 260px; --shadow-sm: 0 1px 3px rgba(0,0,0,0.05); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; display: flex; background-image: radial-gradient(#e5e7eb 1px, transparent 1px); background-size: 24px 24px; }
        .sidebar { width: var(--sidebar-width); background: var(--sidebar-bg); border-right: 1px solid var(--border-color); position: fixed; top: 0; bottom: 0; left: 0; display: flex; flex-direction: column; padding: 24px 16px; z-index: 100; }
        .brand-logo { display: flex; align-items: center; gap: 12px; font-size: 1.25rem; font-weight: 700; color: var(--text-main); padding: 12px; margin-bottom: 32px; border-bottom: 1px solid var(--border-color); text-decoration: none; }
        .nav-menu { display: flex; flex-direction: column; gap: 8px; flex: 1; }
        .nav-item { display: flex; align-items: center; gap: 14px; padding: 12px 16px; color: var(--text-muted); text-decoration: none; font-size: 0.95rem; font-weight: 500; border-radius: 8px; }
        .nav-item:hover { background: #f3f4f6; color: var(--text-main); }
        .nav-item.active { background: rgba(16, 185, 129, 0.1); color: var(--primary); }
        .sidebar-footer { padding: 12px; border-top: 1px solid var(--border-color); }
        .logout-btn { display: flex; align-items: center; gap: 10px; color: #ef4444; text-decoration: none; font-size: 0.95rem; padding: 10px; border-radius: 6px; }
        .main-wrapper { margin-left: var(--sidebar-width); width: calc(100% - var(--sidebar-width)); display: flex; flex-direction: column; min-height: 100vh; }
        .top-header { height: 75px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; padding: 0 40px; background: rgba(250, 250, 250, 0.8); backdrop-filter: blur(8px); }
        .dashboard-content { padding: 40px; flex: 1; max-width: 1000px; }
        .table-container { background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border-color); box-shadow: var(--shadow-sm); overflow: hidden; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background: #f9fafb; padding: 16px 24px; font-weight: 600; color: var(--text-muted); border-bottom: 1px solid var(--border-color); font-size: 0.9rem; text-transform: uppercase; }
        td { padding: 16px 24px; border-bottom: 1px solid var(--border-color); color: var(--text-main); font-size: 0.95rem; }
        tr:hover td { background: #f8fafc; }
        .role-tag { padding: 4px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; }
        .role-admin { background: #fee2e2; color: #b91c1c; }
        .role-user { background: #e0e7ff; color: #1d4ed8; }
        .btn-delete { padding: 8px 14px; background: #fff; color: #ef4444; border: 1px solid #fca5a5; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: 500; }
        .btn-delete:hover { background: #ef4444; color: white; border-color: #ef4444; }
    </style>
</head>
<body>
    <div class="sidebar">
        <a href="/index" class="brand-logo"><span>♻️</span><span>EcoConsole</span></a>
        <div class="nav-menu">
            <a href="/index" class="nav-item">📊 概览中心</a>
            <a href="/identify" class="nav-item">📷 智能识别</a>
            <a href="/chat" class="nav-item">🤖 AI助手</a>
            <a href="/history" class="nav-item">📊 历史统计</a>
            <a href="/community" class="nav-item">🌍 环保社区</a>
            <a href="/users" class="nav-item active">👥 用户管理</a>
        </div>
        <div class="sidebar-footer"><a href="/login" class="logout-btn">🚪 退出工作台</a></div>
    </div>

    <div class="main-wrapper">
        <div class="top-header"><div style="font-weight: 500; color: var(--text-muted);">工作台 / 用户管理</div></div>
        <div class="dashboard-content">
            <div style="margin-bottom: 35px;">
                <h2 style="font-size: 2rem; font-weight: 800; margin-bottom: 6px;">注册用户集控中心</h2>
                <p style="color:var(--text-muted);">实时查看与控制全平台账号信息，主控节点仅管理员可调用操作。</p>
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr><th>用户名 (Username)</th><th>注册邮箱 (Email)</th><th>权限角色 (Role)</th><th>操作 (Actions)</th></tr>
                    </thead>
                    <tbody id="userTableBody">
                        <tr><td colspan="4" style="text-align: center; color: #888;">数据总线连通中，正在获取用户树...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <script>
        async function fetchUsers() {
            try {
                const res = await fetch('/api/users'); const data = await res.json();
                const tbody = document.getElementById('userTableBody');
                if (!data.success || data.users.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" style="text-align: center;">当前账户簇库内未发现激活账户</td></tr>';
                    return;
                }
                let htmlStr = '';
                data.users.forEach(function(u) {
                    let rClass = (u.role === '超级管理员') ? 'role-admin' : 'role-user';
                    let btnHtml = (u.role === '超级管理员') ? 
                        '<span style="color:#9ca3af; font-size:0.85rem;">不可操作</span>' : 
                        '<button class="btn-delete" onclick="deleteUser(\'' + u.username + '\')">注销账号</button>';
                    
                    htmlStr += '<tr>' +
                        '<td style="font-weight:600;">' + u.username + '</td>' +
                        '<td style="color:#6b7280;">' + u.email + '</td>' +
                        '<td><span class="role-tag ' + rClass + '">' + u.role + '</span></td>' +
                        '<td>' + btnHtml + '</td>' +
                    '</tr>';
                });
                tbody.innerHTML = htmlStr;
            } catch { alert("无法与中央数据节点取得通信！"); }
        }

        async function deleteUser(username) {
            if (!confirm('确定要注销 [' + username + '] 的全网数据吗？')) return;
            try {
                const res = await fetch('/api/users/delete', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: username })
                });
                const data = await res.json();
                if (data.success) { alert('✅ ' + data.message); fetchUsers(); } else { alert('❌ ' + data.message); }
            } catch { alert('网络回执异常，注销中止！'); }
        }
        window.onload = fetchUsers;
    </script>
</body>
</html>
