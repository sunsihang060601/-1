<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能识别工作区 - Dashboard</title>
    <style>
        :root { --bg-main: #fafafa; --sidebar-bg: #ffffff; --card-bg: #ffffff; --border-color: #e5e7eb; --text-main: #111827; --text-muted: #6b7280; --primary: #10b981; --sidebar-width: 260px; --shadow-sm: 0 1px 3px rgba(0,0,0,0.05); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; display: flex; background-image: radial-gradient(#e5e7eb 1px, transparent 1px); background-size: 24px 24px; }
        .sidebar { width: var(--sidebar-width); background: var(--sidebar-bg); border-right: 1px solid var(--border-color); position: fixed; top: 0; bottom: 0; left: 0; display: flex; flex-direction: column; padding: 24px 16px; z-index: 100; }
        .brand-logo { display: flex; align-items: center; gap: 12px; font-size: 1.25rem; font-weight: 700; color: var(--text-main); padding: 12px; margin-bottom: 32px; border-bottom: 1px solid var(--border-color); text-decoration: none; }
        .nav-menu { display: flex; flex-direction: column; gap: 8px; flex: 1; }
        .nav-item { display: flex; align-items: center; gap: 14px; padding: 12px 16px; color: var(--text-muted); text-decoration: none; font-size: 0.95rem; font-weight: 500; border-radius: 8px; }
        .nav-item:hover { background: #f3f4f6; color: var(--text-main); }
        .nav-item.active { background: rgba(16, 185, 129, 0.1); color: var(--primary); }
        .sidebar-footer { padding: 12px; border-top: 1px solid var(--border-color); }
        .logout-btn { display: flex; align-items: center; gap: 10px; color: #ef4444; text-decoration: none; font-size: 0.95rem; padding: 10px; border-radius: 6px; }
        .main-wrapper { margin-left: var(--sidebar-width); width: calc(100% - var(--sidebar-width)); display: flex; flex-direction: column; min-height: 100vh; }
        .top-header { height: 75px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; padding: 0 40px; background: rgba(250, 250, 250, 0.8); backdrop-filter: blur(8px); }
        .dashboard-content { padding: 40px; flex: 1; }
        .main-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
        .card { background: #ffffff; border: 1px solid var(--border-color); border-radius: 16px; padding: 35px; box-shadow: var(--shadow-sm); }
        .upload-box { border: 2px dashed #cbd5e1; border-radius: 12px; padding: 40px 20px; text-align: center; cursor: pointer; display: block; color: var(--text-muted); }
        .upload-box:hover { border-color: var(--primary); background: #f9fafb; }
        #uploadImg { display: none; }
        .preview-area { display: none; margin-top: 15px; }
        .preview-img { max-width: 100%; max-height: 260px; border-radius: 8px; display: block; margin: 0 auto 15px; }
        .recognize-btn { width: 100%; padding: 14px; background: var(--primary); color: #fff; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; }
        .result-box { padding: 20px; background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 12px; margin-top: 20px; display: none; }
        .camera-preview { height: 320px; background: #1f2937; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #fff; overflow: hidden; }
        .camera-btn { width: 100%; padding: 14px; background: #3b82f6; color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>
    <div class="sidebar">
        <a href="/index" class="brand-logo"><span>♻️</span><span>EcoConsole</span></a>
        <div class="nav-menu">
            <a href="/index" class="nav-item">📊 概览中心</a>
            <a href="/identify" class="nav-item active">📷 智能识别</a>
            <a href="/chat" class="nav-item">🤖 AI助手</a>
            <a href="/history" class="nav-item">📊 历史统计</a>
            <a href="/community" class="nav-item">🌍 环保社区</a>
            <a href="/users" class="nav-item">👥 用户管理</a>
        </div>
        <div class="sidebar-footer"><a href="/login" class="logout-btn">🚪 退出工作台</a></div>
    </div>

    <div class="main-wrapper">
        <div class="top-header"><div style="font-weight: 500; color: var(--text-muted);">工作台 / 智能识别</div></div>
        <div class="dashboard-content">
            <div class="main-grid">
                <div class="card">
                    <h3 style="margin-bottom:15px;">📁 本地静态推理解析</h3>
                    <label class="upload-box" for="uploadImg">📤 点击或拖拽上传图片</label>
                    <input type="file" id="uploadImg" accept="image/*">
                    <div class="preview-area" id="previewArea">
                        <img id="previewImg" class="preview-img">
                        <button class="recognize-btn" id="recognizeBtn">启动 YOLO 大模型推理</button>
                    </div>
                    <div class="result-box" id="resultBox">
                        <h3 style="color:var(--primary); margin-bottom:8px;">✨ 推理完成</h3>
                        <div id="resultContent" style="font-size:0.95rem; line-height:1.6;"></div>
                    </div>
                </div>
                <div class="card">
                    <h3 style="margin-bottom:15px;">📹 外接高帧率视频流识别</h3>
                    <div class="camera-preview" id="cameraPreview">
                        <div id="placeholder">🎬 摄像头捕捉就绪</div>
                        <img id="liveVideo" style="width:100%; height:100%; object-fit:cover; display:none;">
                    </div>
                    <button class="camera-btn" id="toggleCamBtn" style="margin-top:20px;">开启实时流识别</button>
                </div>
            </div>
        </div>
    </div>
    <script>
        const uploadImg = document.getElementById('uploadImg'); const previewArea = document.getElementById('previewArea');
        const previewImg = document.getElementById('previewImg'); const recognizeBtn = document.getElementById('recognizeBtn');
        const resultBox = document.getElementById('resultBox'); const resultContent = document.getElementById('resultContent');
        let fileObj = null;

        // 💥 新增：保存图片识别历史记录到本地数据库
        function saveIdentifyHistory(name, category) {
            let history = JSON.parse(localStorage.getItem('identifyHistory')) || [];
            const now = new Date();
            const timeString = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
            
            // 将最新记录推入数组头部
            history.unshift({ time: timeString, name: name, category: category, mode: "图片解析" });
            if(history.length > 20) history.pop(); // 最多存20条
            localStorage.setItem('identifyHistory', JSON.stringify(history));
        }

        uploadImg.onchange = function(e) {
            fileObj = e.target.files[0];
            if (fileObj) {
                const reader = new FileReader();
                reader.onload = e => { previewImg.src = e.target.result; previewArea.style.display = 'block'; resultBox.style.display = 'none'; };
                reader.readAsDataURL(fileObj);
            }
        };

        recognizeBtn.onclick = async function() {
            if(!fileObj) return; recognizeBtn.innerText = "正在解算检测张量..."; recognizeBtn.disabled = true;
            const form = new FormData(); form.append('file', fileObj);
            try {
                const res = await fetch('/api/identify', { method: 'POST', body: form }); const data = await res.json();
                if (data.success) {
                    resultContent.innerHTML = `<p>检测目标：<strong>${data.name}</strong></p><p>标准归类：<span style="color:var(--primary); font-weight:bold;">${data.category}</span></p><p>指引建议：${data.tip}</p>`;
                    resultBox.style.display = 'block';
                    
                    // 💥 新增：成功拿到结果，立即写入历史归档
                    saveIdentifyHistory(data.name, data.category);
                }
            } catch { alert("识别发生错误！"); }
            recognizeBtn.innerText = "启动 YOLO 大模型推理"; recognizeBtn.disabled = false;
        };

        let camOpen = false;
        document.getElementById('toggleCamBtn').onclick = function() {
            const video = document.getElementById('liveVideo'); const placeholder = document.getElementById('placeholder');
            if(!camOpen) {
                placeholder.style.display = 'none'; video.style.display = 'block';
                video.src = "/video_feed?" + new Date().getTime(); this.innerText = "🛑 切断实时捕获流"; this.style.background = "#ef4444";
                camOpen = true;
                
                // 💥 新增：开启摄像头也在历史里打个卡
                let history = JSON.parse(localStorage.getItem('identifyHistory')) || [];
                const now = new Date();
                const timeString = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
                history.unshift({ time: timeString, name: "实时监控流已启动", category: "多端流媒体", mode: "动态流" });
                localStorage.setItem('identifyHistory', JSON.stringify(history));
            } else {
                video.src = ""; video.style.display = 'none'; placeholder.style.display = 'block';
                this.innerText = "开启实时流识别"; this.style.background = "#3b82f6";
                camOpen = false;
            }
        };
    </script>
</body>
</html>
