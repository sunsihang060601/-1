<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>低碳环保社区 - Dashboard</title>
    <style>
        :root { --bg-main: #fafafa; --sidebar-bg: #ffffff; --card-bg: #ffffff; --border-color: #e5e7eb; --text-main: #111827; --text-muted: #6b7280; --primary: #10b981; --sidebar-width: 260px; --shadow-sm: 0 1px 3px rgba(0,0,0,0.05); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; display: flex; background-image: radial-gradient(#e5e7eb 1px, transparent 1px); background-size: 24px 24px; }
        .sidebar { width: var(--sidebar-width); background: var(--sidebar-bg); border-right: 1px solid var(--border-color); position: fixed; top: 0; bottom: 0; left: 0; display: flex; flex-direction: column; padding: 24px 16px; z-index: 100; }
        .brand-logo { display: flex; align-items: center; gap: 12px; font-size: 1.25rem; font-weight: 700; color: var(--text-main); padding: 12px; margin-bottom: 32px; border-bottom: 1px solid var(--border-color); text-decoration: none; transition: 0.2s; }
        .brand-logo:hover { opacity: 0.8; }
        .nav-menu { display: flex; flex-direction: column; gap: 8px; flex: 1; }
        .nav-item { display: flex; align-items: center; gap: 14px; padding: 12px 16px; color: var(--text-muted); text-decoration: none; font-size: 0.95rem; font-weight: 500; border-radius: 8px; transition: 0.2s; }
        .nav-item:hover { background: #f3f4f6; color: var(--text-main); }
        .nav-item.active { background: rgba(16, 185, 129, 0.1); color: var(--primary); }
        .sidebar-footer { padding: 12px; border-top: 1px solid var(--border-color); }
        .logout-btn { display: flex; align-items: center; gap: 10px; color: #ef4444; text-decoration: none; font-size: 0.95rem; padding: 10px; border-radius: 6px; }
        .logout-btn:hover { background: #fef2f2; }
        .main-wrapper { margin-left: var(--sidebar-width); width: calc(100% - var(--sidebar-width)); display: flex; flex-direction: column; min-height: 100vh; }
        .top-header { height: 75px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; padding: 0 40px; background: rgba(250, 250, 250, 0.8); backdrop-filter: blur(8px); }
        .dashboard-content { padding: 40px; flex: 1; max-width: 800px; margin: 0 auto; width: 100%; animation: fadeIn 0.5s ease-out; }
        .publish-card { background: #ffffff; border: 1px solid var(--border-color); border-radius: 16px; padding: 25px; margin-bottom: 30px; box-shadow: var(--shadow-sm); }
        .publish-text { width: 100%; height: 90px; border: 1px solid var(--border-color); border-radius: 8px; padding: 12px; font-size: 0.95rem; resize: none; outline: none; background: #f9fafb; }
        .publish-text:focus { border-color: var(--primary); background: #fff; }
        .publish-row { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; }
        .post { background: #ffffff; border: 1px solid var(--border-color); border-radius: 16px; padding: 25px; margin-bottom: 20px; box-shadow: var(--shadow-sm); }
        .post-head { display: flex; align-items: center; gap: 12px; margin-bottom: 15px; }
        .user-avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        .post-img { max-width: 100%; max-height: 300px; border-radius: 8px; margin: 12px 0; object-fit: cover; display: block; }
        .actions { display: flex; gap: 20px; border-top: 1px solid #f3f4f6; padding-top: 12px; margin-top: 12px; color: var(--text-muted); font-size: 0.9rem; }
        .action-btn { cursor: pointer; display: flex; align-items: center; gap: 4px; }
        .action-btn:hover { color: var(--primary); }
        .comment-box { background: #f9fafb; border-radius: 8px; padding: 12px; margin-top: 12px; }
        .comment-item { font-size: 0.9rem; margin-bottom: 6px; color: #374151; }
        .comment-input { width: 100%; border: 1px solid var(--border-color); border-radius: 20px; padding: 8px 16px; font-size: 0.88rem; outline: none; margin-top: 8px; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="sidebar">
        <a href="/index" class="brand-logo"><span>🌍</span><span>EcoConsole</span></a>
        <div class="nav-menu">
            <a href="/index" class="nav-item">📊 概览中心</a>
            <a href="/identify" class="nav-item">📷 智能识别</a>
            <a href="/chat" class="nav-item">🤖 AI助手</a>
            <a href="/history" class="nav-item">📊 历史统计</a>
            <a href="/community" class="nav-item active">🌍 环保社区</a>
            <a href="/users" class="nav-item">👥 用户管理</a>
        </div>
        <div class="sidebar-footer"><a href="/login" class="logout-btn">🚪 退出工作台</a></div>
    </div>

    <div class="main-wrapper">
        <div class="top-header"><div style="font-weight: 500; color: var(--text-muted);">工作台 / 环保社区</div></div>
        <div class="dashboard-content">
            <div class="publish-card">
                <textarea class="publish-text" placeholder="分享今天的绿色生活、分类打卡心得吧..."></textarea>
                <img id="preview" style="max-width:120px; display:none; border-radius:6px; margin-top:10px;">
                <div class="publish-row">
                    <label style="color:var(--primary); cursor:pointer;" for="imageInput">📷 添加图片流</label>
                    <input type="file" id="imageInput" accept="image/*" style="display:none;">
                    <button style="padding:8px 20px; background:var(--primary); color:#fff; border:none; border-radius:6px; font-weight:600; cursor:pointer;" onclick="publish()">发布打卡</button>
                </div>
            </div>
            <div id="postList"></div>
        </div>
    </div>

    <script>
        function escapeHTML(str) { return str.replace(/[&<>'"]/g, t => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[t] || t)); }
        let posts = JSON.parse(localStorage.getItem('ecoPosts')) || [];
        const imgInput = document.getElementById('imageInput');
        const preview = document.getElementById('preview');
        let currentImg = '';

        imgInput.onchange = function() {
            const file = this.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = e => { currentImg = e.target.result; preview.src = currentImg; preview.style.display = 'block'; };
                reader.readAsDataURL(file);
            }
        };

        function publish() {
            const text = document.querySelector('.publish-text').value.trim();
            if (!text && !currentImg) return;
            posts.unshift({ id: Date.now(), name: localStorage.getItem('currentUser') || '绿色先锋', content: text, img: currentImg, likes: 0, comments: [], time: '刚刚' });
            localStorage.setItem('ecoPosts', JSON.stringify(posts));
            render();
            document.querySelector('.publish-text').value = '';
            preview.style.display = 'none'; currentImg = '';
        }

        function render() {
            const list = document.getElementById('postList');
            if(posts.length === 0) { list.innerHTML = '<div style="text-align:center;color:#888;">暂无社区动态</div>'; return; }
            list.innerHTML = posts.map(p => `
                <div class="post">
                    <div class="post-head"><div class="user-avatar">${escapeHTML(p.name)[0]}</div><div><strong>${escapeHTML(p.name)}</strong><div style="font-size:0.8rem;color:var(--text-muted);">${p.time}</div></div></div>
                    <div class="post-content">${escapeHTML(p.content)}</div>
                    ${p.img ? `<img src="${p.img}" class="post-img">` : ''}
                    <div class="actions">
                        <div class="action-btn" onclick="like(${p.id})">❤️ ${p.likes}</div>
                        <div class="action-btn">💬 ${p.comments.length}</div>
                    </div>
                    <div class="comment-box">
                        ${p.comments.map(c => `<div class="comment-item">${escapeHTML(c)}</div>`).join('')}
                        <input class="comment-input" placeholder="发表评论..." onkeydown="if(event.key==='Enter')sendComment(${p.id},this)">
                    </div>
                </div>
            `).join('');
        }

        function like(id) { const item = posts.find(x => x.id === id); if(item) item.likes++; localStorage.setItem('ecoPosts', JSON.stringify(posts)); render(); }
        function sendComment(id, ipt) { const val = ipt.value.trim(); if(!val) return; const item = posts.find(x => x.id === id); if(item) { item.comments.push((localStorage.getItem('currentUser')||'我')+ '：' + val); localStorage.setItem('ecoPosts', JSON.stringify(posts)); render(); } }
        render();
    </script>
</body>
</html>
