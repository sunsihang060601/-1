<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>垃圾分类智能系统 - 立即注册</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f0f9f4 0%, #e6f7ef 100%);
            color: #333;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            animation: bgShift 12s ease infinite alternate;
        }

        /* 背景渐变动画 */
        @keyframes bgShift {
            0% { background: linear-gradient(135deg, #f0f9f4 0%, #e6f7ef 100%); }
            50% { background: linear-gradient(135deg, #e6f7ef 0%, #d6f0e8 100%); }
            100% { background: linear-gradient(135deg, #f0f9f4 0%, #e6f7ef 100%); }
        }

        /* 高级浮动粒子背景 */
        .bg-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #78c2ad, transparent),
                radial-gradient(2px 2px at 60px 70px, #99e2f7, transparent),
                radial-gradient(1.5px 1.5px at 100px 150px, #78c2ad, transparent),
                radial-gradient(1.5px 1.5px at 150px 100px, #99e2f7, transparent);
            background-size: 200px 200px;
            opacity: 0.4;
            z-index: 0;
            pointer-events: none;
            animation: float 20s linear infinite;
        }

        @keyframes float {
            0% { transform: translateY(0) translateX(0) scale(1); }
            50% { transform: translateY(-15px) translateX(15px) scale(1.02); }
            100% { transform: translateY(0) translateX(0) scale(1); }
        }

        /* 注册卡片：悬浮 + 呼吸阴影 + 入场动画 */
        .register-container {
            background: #ffffff;
            border-radius: 24px;
            padding: 50px;
            width: 100%;
            max-width: 450px;
            position: relative;
            z-index: 1;
            box-shadow: 
                0 8px 30px rgba(0, 0, 0, 0.05),
                0 0 0 1px rgba(91, 169, 150, 0.05);
            animation: cardEnter 1.1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        @keyframes cardEnter {
            0% { opacity: 0; transform: translateY(40px) scale(0.96); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .register-container:hover {
            transform: translateY(-4px);
            box-shadow: 
                0 16px 40px rgba(0, 0, 0, 0.08),
                0 0 0 1px rgba(91, 169, 150, 0.12);
        }

        .register-header {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeUp 1.2s 0.1s forwards;
            opacity: 0;
        }

        .logo {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            font-size: 1.8rem;
            font-weight: 600;
            color: #5ba996;
            margin-bottom: 15px;
            animation: logoPulse 3s infinite ease-in-out;
        }

        @keyframes logoPulse {
            0%,100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }

        .welcome-text {
            font-size: 1.5rem;
            font-weight: 600;
            color: #445550;
            margin-bottom: 8px;
        }

        .sub-text {
            color: #667771;
            font-size: 1rem;
        }

        /* 输入框：动态效果 */
        .input-group {
            margin-bottom: 25px;
            opacity: 0;
            animation: fadeUp 1.2s 0.2s forwards;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #556660;
            font-weight: 500;
            font-size: 1rem;
            transition: all 0.2s;
        }

        .input-group input {
            width: 100%;
            padding: 15px 20px;
            border: 1px solid #e8f1ee;
            border-radius: 12px;
            font-size: 1rem;
            background: #f8faf9;
            transition: all 0.35s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .input-group input:focus {
            outline: none;
            border-color: #5ba996;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(91, 169, 150, 0.12);
            transform: translateY(-1px);
        }

        .password-container {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #889990;
            font-size: 1.1rem;
            user-select: none;
            transition: 0.2s;
        }

        .toggle-password:hover {
            color: #5ba996;
            transform: translateY(-50%) scale(1.1);
        }

        .register-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(90deg, #78c2ad, #99e2f7, #78c2ad);
            background-size: 200% 100%;
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 6px 20px rgba(120, 194, 173, 0.25);
            opacity: 0;
            animation: fadeUp 1.2s 0.4s forwards;
            margin-top: 10px;
        }

        @keyframes btnShine {
            0% { background-position: 0 0; }
            100% { background-position: 200% 0; }
        }

        .register-btn {
            animation: fadeUp 1.2s 0.4s forwards, btnShine 6s linear infinite;
        }

        .register-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 32px rgba(120, 194, 173, 0.35);
        }

        .register-btn:active {
            transform: translateY(0);
        }

        .login-link {
            text-align: center;
            margin-top: 25px;
            opacity: 0;
            animation: fadeUp 1.2s 0.45s forwards;
        }

        .login-link p {
            color: #667771;
            font-size: 0.95rem;
        }

        .login-link a {
            color: #5ba996;
            text-decoration: none;
            font-weight: 500;
            transition: 0.2s;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 500px) {
            .register-container {
                padding: 30px;
                margin: 0 20px;
            }
            .logo {
                font-size: 1.5rem;
            }
            .welcome-text {
                font-size: 1.3rem; 
            }
            .input-group input {
                padding: 15px;
                font-size: 1rem; 
            }
        }
    </style>
</head>
<body>
    <div class="bg-particles"></div>
    <div class="register-container">
        <div class="register-header">
            <div class="logo">
                <span>♻️</span>
                <span>垃圾分类智能系统</span>
            </div>
            <h1 class="welcome-text">立即注册</h1>
            <p class="sub-text">创建你的账号，开启智能垃圾分类之旅</p>
        </div>

        <form id="registerForm">
            <div class="input-group">
                <label for="username">用户名</label>
                <input type="text" id="username" placeholder="请输入用户名" required>
            </div>

            <div class="input-group">
                <label for="email">邮箱</label>
                <input type="email" id="email" placeholder="请输入邮箱" required>
            </div>

            <div class="input-group">
                <label for="password">密码</label>
                <div class="password-container">
                    <input type="password" id="password" placeholder="请输入密码" required minlength="6">
                    <span class="toggle-password" id="togglePassword">👁️</span>
                </div>
            </div>

            <div class="input-group">
                <label for="confirmPassword">确认密码</label>
                <div class="password-container">
                    <input type="password" id="confirmPassword" placeholder="请再次输入密码" required minlength="6">
                    <span class="toggle-password" id="toggleConfirmPassword">👁️</span>
                </div>
            </div>

            <button type="submit" class="register-btn">注册</button>
        </form>

        <div class="login-link">
            <p>已有账号？<a href="/login">立即登录</a></p>
        </div>
    </div>

    <script>
       // 注册表单提交：发送给后端
        const registerForm = document.getElementById('registerForm');
        registerForm.addEventListener('submit', async function (e) {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const passwordVal = document.getElementById('password').value;
            const confirmPasswordVal = document.getElementById('confirmPassword').value;

            if (passwordVal !== confirmPasswordVal) {
                alert('两次输入的密码不一致，请重新输入！');
                return;
            }

            try {
                // 真正发起网络请求给 Flask
                const response = await fetch('/api/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        username: username, 
                        email: email, 
                        password: passwordVal 
                    })
                });
                
                const data = await response.json();

                if (data.success) {
                    alert('注册成功！即将跳转到登录页。');
                    window.location.href = '/login';
                } else {
                    // 显示后端返回的错误（如用户名已存在）
                    alert('❌ ' + data.message);
                }
            } catch (err) {
                alert('网络出错了，请稍后再试！');
                console.error(err);
            }
        });
    </script>
</body>
</html>
